    <script>
      // JavaScript for magnetic tile effects - only neighboring tiles are affected
      document.addEventListener('DOMContentLoaded', function() {
        const tileContainers = document.querySelectorAll('.tile-container');
        
        // Add hover event listeners to each tile container
        tileContainers.forEach((container, index) => {
          const tileWrapper = container.querySelector('.tile-wrapper');
          
          // Mouse enter event - apply magnetic effect to neighbors
          container.addEventListener('mouseenter', function() {
            // Add active class to hovered tile
            tileWrapper.classList.add('tile-hovered');
            
            // Find and affect neighboring tiles
            const neighbors = getNeighboringTiles(index, tileContainers.length);
            neighbors.forEach(neighborIndex => {
              const neighborWrapper = tileContainers[neighborIndex].querySelector('.tile-wrapper');
              neighborWrapper.classList.add('tile-neighbor');
            });
          });
          
          // Mouse leave event - remove magnetic effect
          container.addEventListener('mouseleave', function() {
            // Remove active class from hovered tile
            tileWrapper.classList.remove('tile-hovered');
            
            // Remove neighbor effect from all tiles
            tileContainers.forEach(tile => {
              tile.querySelector('.tile-wrapper').classList.remove('tile-neighbor');
            });
          });
        });
        
        // Function to determine neighboring tiles based on grid layout
        function getNeighboringTiles(currentIndex, totalTiles) {
          const neighbors = [];
          const tilesPerRow = 4; // 4 tiles per row (col-md-3)
          const currentRow = Math.floor(currentIndex / tilesPerRow);
          const currentCol = currentIndex % tilesPerRow;
          
          // Check all 8 possible neighboring positions
          const positions = [
            [-1, -1], [-1, 0], [-1, 1], // Top row
            [0, -1],           [0, 1],  // Same row (left and right)
            [1, -1],  [1, 0],  [1, 1]   // Bottom row
          ];
          
          positions.forEach(([rowOffset, colOffset]) => {
            const neighborRow = currentRow + rowOffset;
            const neighborCol = currentCol + colOffset;
            const neighborIndex = neighborRow * tilesPerRow + neighborCol;
            
            // Check if neighbor is within bounds
            if (neighborRow >= 0 && 
                neighborCol >= 0 && 
                neighborCol < tilesPerRow && 
                neighborIndex < totalTiles) {
              neighbors.push(neighborIndex);
            }
          });
          
          return neighbors;
        }
      });
    </script>
